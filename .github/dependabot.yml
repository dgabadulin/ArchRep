version: 2
updates:
  # Backend (BFF) — зависимости в корне репозитория
  - package-ecosystem: npm
    directory: "/"
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    commit-message:
      prefix: "chore(deps)"

  # Frontend (Vue 3 + Vite)
  - package-ecosystem: npm
    directory: "/frontend-v3"
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    commit-message:
      prefix: "chore(deps)"
