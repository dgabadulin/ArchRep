name: Release notes artifact

# Asset release-notes.md — источник новости для сайта (archrep-site).
# Запускается:
#   1) публикацией GitHub Release, созданного вручную (gh release create) — событие `release`;
#   2) вручную: workflow_dispatch (input tag);
#   3) из release-please.yml (workflow_call).
# Причина пункта 3: релиз, созданный Release Please через GITHUB_TOKEN, НЕ порождает
# событие `release: published` (защита GitHub от рекурсии), поэтому asset иначе не появится.

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: 'Тег релиза (vX.Y.Z)'
        required: true
  workflow_call:
    inputs:
      tag:
        description: 'Тег релиза (vX.Y.Z)'
        required: true
        type: string

permissions:
  contents: write

jobs:
  notes:
    runs-on: ubuntu-latest
    steps:
      - name: Resolve tag
        id: tag
        run: |
          TAG="${{ inputs.tag || github.event.release.tag_name }}"
          if [ -z "$TAG" ]; then
            echo "tag is empty (inputs.tag / release.tag_name)" >&2
            exit 1
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ steps.tag.outputs.tag }}

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Fetch release body
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release view "${{ steps.tag.outputs.tag }}" --json body -q '.body' > release-body.md

      - name: Generate release notes
        # Источник текста — body релиза (согласованные формулировки); служебные релизы
        # заменяются шаблоном внутри scripts/release-notes.js.
        run: node scripts/release-notes.js --tag "${{ steps.tag.outputs.tag }}" --body-file release-body.md --out release-notes.md

      - name: Upload to release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release upload "${{ steps.tag.outputs.tag }}" release-notes.md --clobber
