name: Release notes artifact

# На публикацию GitHub Release выкладываем release-notes.md (секция CHANGELOG.md на теге).
# Источник для сайта (archrep-site): GitHub Releases API / asset release-notes.md.

on:
  release:
    types: [published]

permissions:
  contents: write

jobs:
  notes:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.release.tag_name }}
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Generate release notes
        run: node scripts/release-notes.js --tag "${{ github.event.release.tag_name }}" --out release-notes.md
      - name: Upload to release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release upload "${{ github.event.release.tag_name }}" release-notes.md --clobber
