name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  backend:
    name: Backend checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
      - name: Install
        run: npm ci --no-audit --no-fund || npm install --no-audit --no-fund
      - name: Tests
        run: npm test
      - name: RBAC coverage
        run: npm run check:routes
      - name: Modules diagnostics
        run: npm run modules:status

  frontend:
    name: Frontend build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: frontend-v3/package-lock.json
      - name: Install
        working-directory: frontend-v3
        run: npm ci --no-audit --no-fund || npm install --no-audit --no-fund
      - name: Build (vite)
        working-directory: frontend-v3
        run: npm run build
